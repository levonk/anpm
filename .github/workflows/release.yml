name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build the Rust binary for each target platform.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare archive (unix)
        if: matrix.archive != 'zip'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p staging
          cp target/${{ matrix.target }}/release/apmw staging/
          tar -czf apmw-${VERSION}-${{ matrix.target }}.tar.gz -C staging apmw

      - name: Prepare archive (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p staging
          cp target/${{ matrix.target }}/release/apmw.exe staging/
          cd staging && zip ../apmw-${VERSION}-${{ matrix.target }}.zip apmw.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: apmw-${{ matrix.target }}
          path: apmw-*-${{ matrix.target }}.*

  # ---------------------------------------------------------------------------
  # Generate a changelog and create the GitHub Release with all assets.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD 2>/dev/null || echo "Initial release")
          else
            CHANGELOG="Initial release"
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Download the archive for your platform from the assets below, or
            install via your package manager:

            - **npm**: `npm install -g apmw`
            - **PyPI**: `pip install apmw`
            - **Homebrew**: `brew install levonk/apmw/apmw`
            - **Nix**: `nix run github:levonk/apmw`
            - **Devbox**: see `packaging/devbox/`
            - **apt/deb**: see `packaging/deb/`
            - **RPM**: see `packaging/rpm/`
            - **Alpine apk**: see `packaging/apk/`
            - **AUR**: `yay -S apmw-bin`
            - **Winget**: `winget install levonk.apmw`
          files: artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ---------------------------------------------------------------------------
  # Generate ecosystem packages from the pre-built binaries.
  # ---------------------------------------------------------------------------
  generate-packages:
    name: Generate ecosystem packages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate all ecosystem packages
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGING_DIR="$GITHUB_WORKSPACE/packaging"
          OUTPUT_DIR="$GITHUB_WORKSPACE/dist-packages"
          mkdir -p "$OUTPUT_DIR"

          # Run each generator and collect output.
          for gen in npm pypi brew nix devbox apt winget apk deb rpm aur; do
            echo "::group::Generating $gen package"
            if [ -x "$PACKAGING_DIR/$gen/generate.sh" ]; then
              "$PACKAGING_DIR/$gen/generate.sh" "$VERSION" "$OUTPUT_DIR/$gen" || {
                echo "::warning::$gen generator failed"
              }
            fi
            echo "::endgroup::"
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ecosystem-packages
          path: dist-packages/

  # ---------------------------------------------------------------------------
  # Publish to npm (conditional — only if NPM_TOKEN is set).
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: generate-packages
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate npm package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/npm/generate.sh "$VERSION" ./npm-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm-dist
          npm publish --access public

  # ---------------------------------------------------------------------------
  # Publish to PyPI (conditional — only if PYPI_API_TOKEN is set).
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: generate-packages
    if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate PyPI package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/pypi/generate.sh "$VERSION" ./pypi-dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: |
          cd pypi-dist
          python -m build

      - name: Publish to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_USERNAME: __token__
        run: |
          cd pypi-dist
          twine upload dist/*

  # ---------------------------------------------------------------------------
  # Publish Homebrew formula to the tap repository (conditional).
  # ---------------------------------------------------------------------------
  publish-brew:
    name: Publish Homebrew formula
    runs-on: ubuntu-latest
    needs: generate-packages
    if: ${{ vars.ENABLE_BREW_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/brew/generate.sh "$VERSION" ./brew-dist

      - name: Publish to homebrew tap
        if: ${{ secrets.BREW_TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.BREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Clone the tap repo, copy the formula, commit, and push.
          git clone "https://x-access-token:${GH_TOKEN}@github.com/levonk/homebrew-apmw" /tmp/tap
          cp brew-dist/apmw.rb "/tmp/tap/Formula/apmw.rb"
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/apmw.rb
          git commit -m "apmw ${VERSION}" || exit 0
          git push

  # ---------------------------------------------------------------------------
  # Publish AUR package (conditional).
  # ---------------------------------------------------------------------------
  publish-aur:
    name: Publish AUR package (apmw-bin)
    runs-on: ubuntu-latest
    needs: generate-packages
    if: ${{ vars.ENABLE_AUR_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate AUR package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/aur/generate.sh "$VERSION" ./aur-dist

      - name: Publish to AUR
        if: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          git clone "ssh://aur@aur.archlinux.org/apmw-bin.git" /tmp/aur
          cp aur-dist/PKGBUILD aur-dist/.SRCINFO /tmp/aur/
          cd /tmp/aur
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "apmw-bin ${VERSION}" || exit 0
          git push

  # ---------------------------------------------------------------------------
  # Publish Winget manifest (conditional).
  # ---------------------------------------------------------------------------
  publish-winget:
    name: Publish Winget manifest
    runs-on: ubuntu-latest
    needs: generate-packages
    if: ${{ vars.ENABLE_WINGET_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Winget manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/winget/generate.sh "$VERSION" ./winget-dist

      - name: Submit to winget-pkgs
        if: ${{ secrets.WINGET_GH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.WINGET_GH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Fork winget-pkgs, copy manifests, and open a PR.
          # This is a simplified version — the real submission uses
          # wingetcreate or a PR to microsoft/winget-pkgs.
          echo "Winget manifest generated in ./winget-dist"
          echo "Manual submission required: https://github.com/microsoft/winget-pkgs"
