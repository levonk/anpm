[package]
name = "apmw"
version = "0.1.0"
edition = "2021"
authors = ["levonk <https://github.com/levonk>"]
description = "All Package Manager Wrapper — abstracts every package installer into one intelligent surface"
license = "MIT"
repository = "https://github.com/levonk/apmw"
rust-version = "1.70"

[lib]
name = "apmw"
path = "src/lib.rs"

[[bin]]
name = "apmw"
path = "src/main.rs"

[dependencies]
apmw-core = { path = "../apmw-core", version = "0.1.0" }
tokio = { version = "1.35", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
secrecy = "0.8"
zeroize = "1.7"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
toml = { workspace = true }
dirs = "5"
anstyle = "1"
ureq = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { workspace = true }
which = "7"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
serial_test = "2.0"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
clap_mangen = "0.2"

[[example]]
name = "gen-assets"
path = "examples/gen-assets.rs"

[features]
default = []
daemon = []
agent-mode = []

[[bench]]
name = "performance"
harness = false
