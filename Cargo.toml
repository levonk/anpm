[workspace]
members = ["crates/apmw-core", "crates/apmw"]
resolver = "2"

[workspace.dependencies]
# Shared dependencies used by both crates.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tracing = "0.1"
ureq = { version = "=2.11.0", features = ["json", "tls"], default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
